name: Fetch generated media

on:
  push:
    paths:
      - media-urls.json

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clips
        run: |
          mkdir -p public/media
          curl -fsSL "$(jq -r .orbit media-urls.json)" -o public/media/orbit.mp4
          curl -fsSL "$(jq -r .builder media-urls.json)" -o public/media/builder.mp4
          curl -fsSL "$(jq -r .closer media-urls.json)" -o public/media/closer.mp4
          ls -la public/media
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/media
          git commit -m "Add generated Seedance clips"
          git push
